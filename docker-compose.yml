version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: tripal_db_container
    restart: always
    environment:
      MYSQL_DATABASE: tripal_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - ./db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tripal_pma_container
    restart: always
    ports:
      - "8083:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: tripal_backend_container
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=tripal_db
    depends_on:
      - db